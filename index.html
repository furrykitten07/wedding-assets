
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Fikri & Nadya Wedding Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              maroon: {
                50: '#fdf2f2',
                100: '#fde1e1',
                200: '#f9c7c7',
                300: '#f49f9f',
                400: '#eb6f6f',
                50: '#800000',
                600: '#991b1b',
                700: '#7f1d1d',
                800: '#6b1111',
                900: '#5a1010',
                DEFAULT: '#800000',
              },
              gold: {
                50: '#fbf9f2',
                100: '#f4ecd9',
                200: '#e9d9b1',
                300: '#dbc184',
                400: '#cca55a',
                500: '#c18f3d',
                600: '#a67530',
                700: '#855c2a',
                800: '#6d4b26',
                900: '#5a3f22',
                DEFAULT: '#D4AF37',
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fdfaf7;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #800000;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5a1010;
      }
    </style>

}
</script>
